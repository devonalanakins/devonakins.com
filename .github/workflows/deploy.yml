name: Deploy DevonAkins.com (manual)
run-name: "Release ${{ inputs.release_variant }} / ${{ inputs.expected_sha }}"
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested 40-character main commit to release
        required: true
        type: string
      release_variant:
        description: Default V4; all other variants require distinct owner-approved cutover
        required: true
        type: choice
        options:
          - v4
          - v5
          - professional
          - one-screen
        default: v4
      v5_confirmation:
        description: V5 only - enter V5-CUTOVER-APPROVED after final release acceptance
        required: false
        type: string
      professional_confirmation:
        description: Professional only - enter PROFESSIONAL-CUTOVER-APPROVED after review
        required: false
        type: string
      one_screen_confirmation:
        description: One-screen only - enter ONE-SCREEN-CUTOVER-APPROVED after final release acceptance
        required: false
        type: string
      github_oidc_action:
        description: Signed GitHub Actions receiver - preserve is always the default
        required: true
        type: choice
        options:
          - preserve
          - enable
          - disable
        default: preserve
      github_oidc_confirmation:
        description: Enable only - enter GITHUB-OIDC-ENABLE-APPROVED after privacy review
        required: false
        type: string
      threads_publication_action:
        description: Public read-only Threads feed - preserve by default
        required: true
        type: choice
        options:
          - preserve
          - enable
          - disable
        default: preserve
      threads_publication_confirmation:
        description: Enable only - enter THREADS-PUBLIC-FEED-APPROVED after reviewing consent
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: devonakins-com-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    # Also inherited by wrangler's configured build command: a V5 build
    # must not silently turn back into V4 during deployment.
    env:
      V5_PUBLIC_SITE_CANDIDATE: ${{ inputs.release_variant == 'v5' && '1' || '0' }}
      PROFESSIONAL_SITE_CANDIDATE: ${{ (inputs.release_variant == 'professional' || inputs.release_variant == 'one-screen') && '1' || '0' }}
      ONE_SCREEN_SITE_CANDIDATE: ${{ inputs.release_variant == 'one-screen' && '1' || '0' }}
      # A protected one-screen release must never silently use schematic fallback art.
      REQUIRE_APPROVED_NEURAL_ART: ${{ inputs.release_variant == 'one-screen' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard exact commit, target Worker and release selection
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VARIANT: ${{ inputs.release_variant }}
          V5_CONFIRMATION: ${{ inputs.v5_confirmation }}
          PROFESSIONAL_CONFIRMATION: ${{ inputs.professional_confirmation }}
          ONE_SCREEN_CONFIRMATION: ${{ inputs.one_screen_confirmation }}
          GITHUB_OIDC_ACTION: ${{ inputs.github_oidc_action }}
          GITHUB_OIDC_CONFIRMATION: ${{ inputs.github_oidc_confirmation }}
          THREADS_PUBLICATION_ACTION: ${{ inputs.threads_publication_action }}
          THREADS_PUBLICATION_CONFIRMATION: ${{ inputs.threads_publication_confirmation }}
        # The reviewed guard requires V5-CUTOVER-APPROVED for a V5 cutover.
        # Choosing v5 with the current v4 hotfix commit must fail visibly.
        run: node scripts/manual-release-guard.mjs
      - name: Prepare cinematic MP4 build only for approved one-screen release
        if: inputs.release_variant == 'one-screen'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Build and validate Worker
        run: |
          set -eu
          npm ci
          # Existing V4 tests assert V4 markup and stay mandatory for BOTH
          # release variants. A V5 production run must not execute them against
          # generated V5 HTML or bypass them entirely.
          PROFESSIONAL_SITE_CANDIDATE=0 ONE_SCREEN_SITE_CANDIDATE=0 V5_PUBLIC_SITE_CANDIDATE=0 npm run build
          PROFESSIONAL_SITE_CANDIDATE=0 ONE_SCREEN_SITE_CANDIDATE=0 V5_PUBLIC_SITE_CANDIDATE=0 npm test
          node --check scripts/verify-live.mjs
          node --check scripts/verify-live-v5.mjs
          node --check scripts/verify-live-professional.mjs
          node --check scripts/verify-live-one-screen.mjs
          if [ "$V5_PUBLIC_SITE_CANDIDATE" = '1' ]; then
            # Rebuild the artifact actually selected for production. Wrangler's
            # configured build inherits the job-level flag and repeats V5.
            V5_PUBLIC_SITE_CANDIDATE=1 npm run build
            node scripts/verify-v5-site-candidate.mjs
          fi
          if [ "$PROFESSIONAL_SITE_CANDIDATE" = '1' ] && [ "$ONE_SCREEN_SITE_CANDIDATE" = '0' ]; then
            # Retain the existing professional variant without selecting one-screen.
            PROFESSIONAL_SITE_CANDIDATE=1 ONE_SCREEN_SITE_CANDIDATE=0 V5_PUBLIC_SITE_CANDIDATE=0 npm run build
            node scripts/verify-professional-candidate.mjs
          fi
          if [ "$ONE_SCREEN_SITE_CANDIDATE" = '1' ]; then
            # Only the explicitly confirmed one-screen variant may select BOTH
            # flags. Wrangler's configured build inherits the job-level flags.
            PROFESSIONAL_SITE_CANDIDATE=1 ONE_SCREEN_SITE_CANDIDATE=1 V5_PUBLIC_SITE_CANDIDATE=0 npm run build
            node scripts/verify-one-screen-candidate.mjs
          fi
      - name: Verify approved GitHub repository links remain public
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-portfolio-links.mjs
      - name: Require dedicated Cloudflare CI credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Preserve approved private runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VARIANT: ${{ inputs.release_variant }}
          GITHUB_OIDC_ACTION: ${{ inputs.github_oidc_action }}
          GITHUB_OIDC_CONFIRMATION: ${{ inputs.github_oidc_confirmation }}
          THREADS_PUBLICATION_ACTION: ${{ inputs.threads_publication_action }}
          THREADS_PUBLICATION_CONFIRMATION: ${{ inputs.threads_publication_confirmation }}
        run: node scripts/prepare-private-deploy.mjs
      - name: Deploy only devonakins-personal Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 deploy --config wrangler.deploy.jsonc --keep-vars
      - name: Verify actual public deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [ "$ONE_SCREEN_SITE_CANDIDATE" = '1' ]; then
            node scripts/verify-live-one-screen.mjs
          elif [ "$PROFESSIONAL_SITE_CANDIDATE" = '1' ]; then
            node scripts/verify-live-professional.mjs
          elif [ "$V5_PUBLIC_SITE_CANDIDATE" = '1' ]; then
            node scripts/verify-live-v5.mjs
          else
            node scripts/verify-live.mjs
          fi
      - name: Verify live read-only Threads feed or owner-triggered hiding
        if: inputs.threads_publication_action != 'preserve'
        env:
          THREADS_PUBLICATION_ACTION: ${{ inputs.threads_publication_action }}
        run: node scripts/verify-live-threads.mjs
      - name: Verify live signed receiver gate and reject unsigned requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_OIDC_ACTION: ${{ inputs.github_oidc_action }}
        run: node scripts/verify-oidc-release.mjs
