name: Verify Garage preview
on:
  pull_request:
    branches: [feature/vibe-coding-identity-20261123]
  push:
    branches: [feature/garage-experience-20261127]
permissions:
  contents: read
jobs:
  garage_candidate:
    if: github.head_ref == 'feature/garage-experience-20261127' || github.ref == 'refs/heads/feature/garage-experience-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Verify ordinary build excludes Garage
        run: |
          npm run build
          node --test tests/garage-preview.test.mjs
      - name: Build and test review-only candidate
        run: |
          LABORATORY_SITE_CANDIDATE=1 GARAGE_SITE_CANDIDATE=1 npm run build
          LABORATORY_SITE_CANDIDATE=1 GARAGE_SITE_CANDIDATE=1 node --test tests/garage-preview.test.mjs
      - run: python3 -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python3 -m playwright install --with-deps chromium webkit
      - run: python3 tests/garage_browser_acceptance.py
      - name: Retain preview and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-preview
          path: |
            dist/
            browser-qa/garage/
          if-no-files-found: warn
          retention-days: 14
