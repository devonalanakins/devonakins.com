name: Verify website
on:
  push:
  pull_request:
permissions:
  contents: read
# Latest reviewed PR head wins; protected main checks are never cancelled.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04 # Pinned: Playwright 1.57 browser builds do not support Ubuntu 26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch current remote branches for targeted credential scan
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Test targeted Git history scanner
        run: python3 -m unittest scripts/security/test_scan_git_history.py
      - name: Scan reachable Git history
        run: python3 scripts/security/scan-git-history.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify approved GitHub sources remain publicly accessible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-portfolio-links.mjs
      # Main, PR and feature refs all run tests without reporter privileges.
      - name: Run tests without credentialed reporters
        run: npm test
      - name: Package optional editor companion (PR only)
        if: github.event_name == 'pull_request'
        working-directory: extensions/presence-vscode
        run: |
          mkdir -p ../../.artifacts
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out ../../.artifacts/devonakins-presence.vsix
      - name: Attach optional editor companion (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: presence-vscode
          path: .artifacts/devonakins-presence.vsix
          if-no-files-found: error
          retention-days: 7
      - run: node --check scripts/verify-live.mjs
      - run: node --check scripts/verify-public-signal.mjs
      - name: Verify anonymous public Live Signal (main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-public-signal.mjs

      - name: Verify GPT transactions against real local workerd and D1 (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/gpt-d1" --no-save --no-package-lock --no-fund --no-audit miniflare@5.20261104.0-beta
          GPT_MINIFLARE_ROOT="$RUNNER_TEMP/gpt-d1/node_modules" node tests/gpt-d1-runtime.mjs
          GPT_MINIFLARE_ROOT="$RUNNER_TEMP/gpt-d1/node_modules" node tests/github-d1-runtime.mjs
          GPT_MINIFLARE_ROOT="$RUNNER_TEMP/gpt-d1/node_modules" node tests/threads-workerd-redirect-runtime.mjs
      - name: Probe actual Worker HTTP behavior in isolated local workerd (PR only)
        if: github.event_name == 'pull_request'
        timeout-minutes: 4
        run: |
          set -eu
          npx --yes wrangler@4.158.0 dev --local --ip localhost --port 8787 --infer-origin-from-routes=false > /tmp/devonakins-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if ! node scripts/verify-local-telemetry.mjs; then
            echo 'Local Worker runtime check failed'
            tail -n 60 /tmp/devonakins-workerd.log
            exit 1
          fi

      - name: Install pinned Python Playwright package (PR only)
        if: github.event_name == 'pull_request'
        run: python3 -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Install Chromium and WebKit browser engines (PR only)
        if: github.event_name == 'pull_request'
        run: python3 -m playwright install --with-deps chromium webkit
      - name: Verify V2 navigation, touch targets and WCAG in Chromium and WebKit (PR only)
        if: github.event_name == 'pull_request'
        run: python3 tests/browser_acceptance.py --axe --out browser-qa
      - name: Verify private GPT batch form with synthetic records (PR only)
        if: github.event_name == 'pull_request'
        run: python3 tests/gpt_owner_acceptance.py
      - name: Verify development-only V5 shell and publication fence (PR only)
        if: github.event_name == 'pull_request'
        run: python3 tests/v5_browser_acceptance.py --out browser-qa/v5
      - name: Verify private repository controls with synthetic inventory (PR only)
        if: github.event_name == 'pull_request'
        run: python3 tests/github_owner_acceptance.py
      - name: Verify private owner project-policy repair on mobile (PR only)
        if: github.event_name == 'pull_request'
        run: python3 tests/presence_project_policy_acceptance.py
      - name: Attach browser QA report or failing screenshots (PR only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: browser-qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach built site for visual review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

  activity_report:
    # Only the trusted main push can receive GitHub's short-lived identity.
    # Untrusted PR code never gets the id-token permission.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Tests consume generated dist/ and .release/ assets. Match the normal
      # verifier's build prerequisite instead of falsely failing actual work.
      - name: Build reporter test prerequisites
        run: npm run build
      - name: Test and report signed CI activity (trusted main push)
        env:
          DEVON_ACTIVITY_GITHUB_OIDC: "true"
          # Only trusted main jobs may mint identity. Logs fixed outcomes, no JWT.
          DEVON_ACTIVITY_DIAGNOSE_IDENTITY: "true"
        run: node scripts/activity-run.mjs -- npm test

  v5_candidate:
    if: github.head_ref == 'release/living-mind-v5' || github.ref == 'refs/heads/release/living-mind-v5' || github.head_ref == 'design/public-website-experience' || github.ref == 'refs/heads/design/public-website-experience'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Build opt-in full V5 candidate without changing production defaults
        run: V5_PUBLIC_SITE_CANDIDATE=1 npm run build
      - name: Verify all compiled routes and real Worker date replay
        run: node scripts/verify-v5-site-candidate.mjs
      - run: python3 -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python3 -m playwright install --with-deps chromium webkit
      - name: Verify optional software WebGL camera and context recovery
        run: python3 tests/v5_atlas_lifecycle.py
      - name: Verify full V5 candidate in actual isolated workerd
        run: |
          set -eu
          V5_PUBLIC_SITE_CANDIDATE=1 npx --yes wrangler@4.158.0 dev --local --ip 127.0.0.1 --port 8790 --local-protocol=https --infer-origin-from-routes=false > /tmp/v5-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python3 tests/v5_site_candidate_acceptance.py --origin https://127.0.0.1:8790 --engine chromium
          python3 tests/v5_site_candidate_acceptance.py --origin https://127.0.0.1:8790 --engine webkit
      - name: Preserve candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-full-site-candidate
          path: .artifacts/v5-site-candidate/
          if-no-files-found: warn
          retention-days: 14

  professional_candidate:
    # Source-only preview runs in parallel with the long baseline suite to
    # produce timely desktop/mobile evidence. Baseline verify remains a separate
    # required gate for review and protected release, never bypassed here.
    if: github.head_ref == 'feat/professional-github-portfolio-20261110' || github.ref == 'refs/heads/feat/professional-github-portfolio-20261110' || github.head_ref == 'fix/github-feed-browser-fallback-20261111' || github.ref == 'refs/heads/fix/github-feed-browser-fallback-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Build opt-in professional candidate (production defaults unchanged)
        run: PROFESSIONAL_SITE_CANDIDATE=1 npm run build
      - name: Verify generated routes and linked Worker assets
        run: node scripts/verify-professional-candidate.mjs
      - name: Verify live GitHub browser CORS and safe public projection
        run: node scripts/check-github-browser-origin.mjs
      - name: Install pinned Chromium and WebKit browser acceptance
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Check desktop and phone interactions in both browser engines
        run: python3 tests/professional_browser_acceptance.py
      - name: Preserve reviewable professional candidate and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-site-candidate
          path: |
            dist/
            browser-qa/professional/
          if-no-files-found: warn
          retention-days: 14

  one_screen_candidate:
    # Isolated design candidate: does not change the verified production
    # release variant or publish a new public endpoint.
    if: github.head_ref == 'feat/viewport-one-screen-20261110' || github.ref == 'refs/heads/feat/viewport-one-screen-20261110' || github.head_ref == 'feat/living-studio-orbital-social-20261113' || github.ref == 'refs/heads/feat/living-studio-orbital-social-20261113' || github.head_ref == 'fix/social-facebook-owner-profile-20261113' || github.ref == 'refs/heads/fix/social-facebook-owner-profile-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Build single-viewport professional candidate
        run: PROFESSIONAL_SITE_CANDIDATE=1 ONE_SCREEN_SITE_CANDIDATE=1 npm run build
      - name: Check candidate route and generated assets
        run: node scripts/verify-one-screen-candidate.mjs
      - name: Install pinned cross-browser verifier
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Verify no-scroll desktop, mobile and keyboard-ready sections
        run: python3 tests/one_screen_browser_acceptance.py
      - name: Verify consent-gated social panels and focus on mobile and desktop
        run: python3 tests/social_browser_acceptance.py
      - name: Attach viewport design preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-screen-site-candidate
          path: |
            dist/
            browser-qa/one-screen/
          if-no-files-found: warn
          retention-days: 14
